<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JSON Formatter & Validator — Rahulx.com</title>
<meta name="description" content="Free online JSON formatter, validator, and minifier. Paste JSON to pretty-print, validate syntax, or minify it — runs entirely in your browser.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.rahulx.com/pages/main_pages/tools/json-formatter.html">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Poppins', 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #0d1b2a, #1b263b);
    color: #e0e0e0;
    display: flex; flex-direction: column; align-items: center;
    padding: 15px;
  }
  .sci-fi-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #001f3f55 30%, #000 80%); }
  header { text-align: center; padding: 20px 0 10px; }
  h1 { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #00ffccaa; }
  .tagline { color: #b0e9e4; margin: 8px 0 20px; text-align: center; max-width: 90%; }
  .card {
    background: rgba(5, 32, 65, 0.9); border-radius: 12px; box-shadow: 0 0 15px #00ffcc22;
    padding: 24px; max-width: 800px; width: 100%; margin: 10px auto;
  }
  textarea {
    width: 100%; min-height: 220px; padding: 14px; border-radius: 8px; border: 1px solid #00ffcc55;
    background: #0a1622; color: #cfeff0; font-family: 'Share Tech Mono', monospace; font-size: 0.92rem;
    resize: vertical; line-height: 1.5;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  .action-btn {
    flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 8px; background: #00ffcc;
    color: #06131b; font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 0.5px;
    cursor: pointer; font-size: 0.85rem;
  }
  .action-btn.secondary { background: rgba(0,255,204,0.1); color: #00ffcc; border: 1px solid #00ffcc55; }
  .action-btn:hover { background: #7cffe8; }
  .action-btn.secondary:hover { background: rgba(0,255,204,0.2); }
  .status { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; display: none; }
  .status.ok { display: block; background: rgba(124,255,176,0.1); border: 1px solid #7cffb055; color: #7cffb0; }
  .status.err { display: block; background: rgba(255,77,109,0.1); border: 1px solid #ff4d6d55; color: #ff9daa; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 0.85rem; color: #8fb0ad; }
  footer { text-align: center; padding: 20px 0 10px; font-size: 0.8rem; color: #b0e9e4; }
  footer a { color: #80ffd0; text-decoration: none; }
  a.back { display:inline-block; margin-top:14px; color:#ff9fd6; text-decoration:none; font-size:0.9rem; }
  label.field-label { display: block; color: #00ffcc; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; margin-bottom: 8px; letter-spacing: 0.5px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
</head>
<body>
<div class="sci-fi-bg"></div>
<header>
  <h1>JSON Formatter</h1>
  <p class="tagline">Pretty-print, validate, and minify JSON — instantly, offline, in your browser.</p>
</header>
<main>
  <div class="card">
    <label class="field-label">INPUT</label>
    <textarea id="jsonInput" placeholder='Paste your JSON here, e.g. {"name":"Rahul","tools":["json","base64"]}'></textarea>
    <div class="btn-row">
      <button class="action-btn" onclick="formatJson(2)">PRETTY PRINT</button>
      <button class="action-btn secondary" onclick="minifyJson()">MINIFY</button>
      <button class="action-btn secondary" onclick="validateOnly()">VALIDATE ONLY</button>
      <button class="action-btn secondary" onclick="copyOutput()">COPY OUTPUT</button>
      <button class="action-btn secondary" onclick="clearAll()">CLEAR</button>
    </div>
    <div class="status" id="status"></div>
    <div class="stats" id="stats"></div>
    <label class="field-label" style="margin-top:20px;">OUTPUT</label>
    <textarea id="jsonOutput" readonly placeholder="Formatted result will appear here"></textarea>
  </div>
  <div style="text-align:center;"><a class="back" href="tools.html">&larr; Back to all tools</a></div>
</main>
<footer>
  <p>&copy; 2026 Rahulx.com. All rights reserved. |
    <a href="/about.html">About</a> |
    <a href="/contact.html">Contact</a> |
    <a href="/privacy-policy.html">Privacy Policy</a> |
    <a href="/terms-of-service.html">Terms of Service</a> |
    <a href="/disclaimer.html">Disclaimer</a> |
    <a href="/sitemap.xml">Sitemap</a>
  </p>
</footer>
<script>
  const input = document.getElementById('jsonInput');
  const output = document.getElementById('jsonOutput');
  const status = document.getElementById('status');
  const stats = document.getElementById('stats');

  function showStatus(ok, message) {
    status.className = 'status ' + (ok ? 'ok' : 'err');
    status.textContent = message;
  }

  function updateStats(text) {
    stats.textContent = `Characters: ${text.length} | Lines: ${text.split('\n').length}`;
  }

  function parseInput() {
    const raw = input.value.trim();
    if (!raw) { showStatus(false, 'Paste some JSON first.'); return null; }
    return JSON.parse(raw);
  }

  function formatJson(indent) {
    try {
      const parsed = parseInput();
      if (parsed === null) return;
      const result = JSON.stringify(parsed, null, indent);
      output.value = result;
      updateStats(result);
      showStatus(true, 'Valid JSON — formatted successfully.');
    } catch (e) {
      output.value = '';
      showStatus(false, 'Invalid JSON: ' + e.message);
    }
  }

  function minifyJson() {
    try {
      const parsed = parseInput();
      if (parsed === null) return;
      const result = JSON.stringify(parsed);
      output.value = result;
      updateStats(result);
      showStatus(true, 'Valid JSON — minified successfully.');
    } catch (e) {
      output.value = '';
      showStatus(false, 'Invalid JSON: ' + e.message);
    }
  }

  function validateOnly() {
    try {
      const parsed = parseInput();
      if (parsed === null) return;
      output.value = '';
      const type = Array.isArray(parsed) ? 'array' : typeof parsed;
      showStatus(true, `Valid JSON (top-level type: ${type}).`);
    } catch (e) {
      showStatus(false, 'Invalid JSON: ' + e.message);
    }
  }

  function copyOutput() {
    if (!output.value) return;
    navigator.clipboard.writeText(output.value);
    showStatus(true, 'Output copied to clipboard.');
  }

  function clearAll() {
    input.value = '';
    output.value = '';
    status.className = 'status';
    stats.textContent = '';
  }
</script>
</body>
</html>
