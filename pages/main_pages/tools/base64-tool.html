<body>
<div class="sci-fi-bg"></div>
<header>
  <h1>Base64 Encode / Decode</h1>
  <p class="tagline">Convert text to and from Base64 instantly — runs fully offline in your browser.</p>
</header>
<main>
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="encodeTab" onclick="setMode('encode')">Encode</button>
      <button class="tab-btn" id="decodeTab" onclick="setMode('decode')">Decode</button>
    </div>
    <label class="field-label" id="inputLabel">TEXT TO ENCODE</label>
    <textarea id="b64Input" placeholder="Type or paste text here"></textarea>
    <div class="btn-row">
      <button class="action-btn" id="convertBtn" onclick="convert()">ENCODE</button>
      <button class="action-btn secondary" onclick="swapValues()">SWAP</button>
      <button class="action-btn secondary" onclick="copyResult()">COPY RESULT</button>
      <button class="action-btn secondary" onclick="clearAll()">CLEAR</button>
    </div>
    <div class="status" id="status"></div>
    <label class="field-label" id="outputLabel">BASE64 OUTPUT</label>
    <textarea id="b64Output" readonly></textarea>
  </div>
  <div style="text-align:center;"><a class="back" href="tools.html">&larr; Back to all tools</a></div>
</main>

  </p>
</footer>
<script>
  let mode = 'encode';
  const input = document.getElementById('b64Input');
  const output = document.getElementById('b64Output');
  const status = document.getElementById('status');

  function showStatus(ok, message) {
    status.className = 'status ' + (ok ? 'ok' : 'err');
    status.textContent = message;
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('encodeTab').classList.toggle('active', mode === 'encode');
    document.getElementById('decodeTab').classList.toggle('active', mode === 'decode');
    document.getElementById('inputLabel').textContent = mode === 'encode' ? 'TEXT TO ENCODE' : 'BASE64 TO DECODE';
    document.getElementById('outputLabel').textContent = mode === 'encode' ? 'BASE64 OUTPUT' : 'DECODED TEXT';
    document.getElementById('convertBtn').textContent = mode === 'encode' ? 'ENCODE' : 'DECODE';
    input.placeholder = mode === 'encode' ? 'Type or paste text here' : 'Paste Base64 string here';
    status.className = 'status';
  }

  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function base64ToUtf8(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  function convert() {
    const val = input.value;
    if (!val) { showStatus(false, 'Nothing to convert — type something first.'); return; }
    try {
      if (mode === 'encode') {
        output.value = utf8ToBase64(val);
        showStatus(true, 'Encoded successfully.');
      } else {
        output.value = base64ToUtf8(val.trim());
        showStatus(true, 'Decoded successfully.');
      }
    } catch (e) {
      output.value = '';
      showStatus(false, mode === 'decode' ? 'Invalid Base64 string — cannot decode.' : 'Could not encode this input.');
    }
  }

  function swapValues() {
    const temp = input.value;
    input.value = output.value;
    output.value = temp;
    setMode(mode === 'encode' ? 'decode' : 'encode');
  }

  function copyResult() {
    if (!output.value) return;
    navigator.clipboard.writeText(output.value);
    showStatus(true, 'Result copied to clipboard.');
  }

  function clearAll() {
    input.value = '';
    output.value = '';
    status.className = 'status';
  }
</script>
</body>
